services:
  pokebot:
    image: pokebot-gen3:local
    build:
      context: .
      args:
        POKEBOT_DEBUGGER: ${POKEBOT_DEBUGGER:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${POKEBOT_DASHBOARD_PORT:-8888}:8888"
      - "${POKEBOT_VSCODE_DEBUG_PORT:-5679}:5679"
    volumes:
      - ./roms:/app/roms:ro
      - ./profiles:/app/profiles
      - ./stats:/app/stats
    environment:
      PYTHONUNBUFFERED: "1"
      POKEBOT_INSTANCE_WEB_PORT: "8888"
      POKEBOT_DEBUG: ${POKEBOT_DEBUG:-0}
      POKEBOT_DEBUGGER: ${POKEBOT_DEBUGGER:-}
      POKEBOT_DEBUG_HOST: ${POKEBOT_DEBUG_HOST:-host.docker.internal}
      POKEBOT_DEBUG_PORT: ${POKEBOT_DEBUG_PORT:-5678}
      POKEBOT_VSCODE_DEBUG_PORT: ${POKEBOT_VSCODE_DEBUG_PORT:-5679}
      POKEBOT_CAMPAIGN_TRAINER_NAME: ${POKEBOT_CAMPAIGN_TRAINER_NAME:-Alesjr}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$POKEBOT_DEBUGGER" in
          "")
            exec "$@"
            ;;
          pycharm)
            if [ "$1" = "python" ]; then shift; fi
            exec python -m pydevd --client "$POKEBOT_DEBUG_HOST" --port "$POKEBOT_DEBUG_PORT" --file "$@" --debug
            ;;
          vscode)
            if [ "$1" = "python" ]; then shift; fi
            exec python -m debugpy --listen "0.0.0.0:$POKEBOT_VSCODE_DEBUG_PORT" --wait-for-client "$@" --debug
            ;;
          *)
            echo "Unsupported debugger: $POKEBOT_DEBUGGER" >&2
            exit 2
            ;;
        esac
      - pokebot-entrypoint
    command:
      - python
      - pokebot.py
      - ${POKEBOT_PROFILE:-Sapphire}
      - --bot-mode
      - ${POKEBOT_MODE:-Campaign}
      - --headless
      - --emulation-speed
      - ${POKEBOT_EMULATION_SPEED:-0}
      - --no-audio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
