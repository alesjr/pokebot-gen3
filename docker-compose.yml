services:
  pokebot:
    image: pokebot-gen3:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${POKEBOT_DASHBOARD_PORT:-8888}:8888"
    volumes:
      - ./roms:/app/roms:ro
      - ./profiles:/app/profiles
      - ./stats:/app/stats
    environment:
      PYTHONUNBUFFERED: "1"
      POKEBOT_INSTANCE_WEB_PORT: "8888"
      POKEBOT_MODE: ${POKEBOT_MODE:-Campaign}
      POKEBOT_CAMPAIGN_TRAINER_NAME: ${POKEBOT_CAMPAIGN_TRAINER_NAME:-Alesjr}
    command:
      - python
      - pokebot.py
      - ${POKEBOT_PROFILE:-Sapphire}
      - --bot-mode
      - ${POKEBOT_MODE:-Campaign}
      - --headless
      - --emulation-speed
      - ${POKEBOT_EMULATION_SPEED:-0}
      - --no-audio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
