x-pokebot-common: &pokebot-common
  image: pokebot-gen3:local
  build:
    context: .
  init: true
  stdin_open: true
  tty: true
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    # All save states, screenshots, stats, RTC anchors, and configuration live
    # below the profile directory. Never mount those paths separately.
    - ./roms:/app/roms:ro
    - ./profiles:/app/profiles
  environment:
    PYTHONUNBUFFERED: "1"
    POKEBOT_FLEET_TOKEN: ${POKEBOT_FLEET_TOKEN:-}
    POKEBOT_FLEET_URL: http://fleet-coordinator:8877
    POKEBOT_WEB_USERNAME: ${POKEBOT_WEB_USERNAME:?set POKEBOT_WEB_USERNAME in .env}
    POKEBOT_WEB_PASSWORD_HASH: ${POKEBOT_WEB_PASSWORD_HASH:?set POKEBOT_WEB_PASSWORD_HASH in .env}
    POKEBOT_WEB_SESSION_SECRET: ${POKEBOT_WEB_SESSION_SECRET:?set POKEBOT_WEB_SESSION_SECRET in .env}
    POKEBOT_COOKIE_SECURE: ${POKEBOT_COOKIE_SECURE:-1}
    POKEBOT_PROFILE_PORTS: ${POKEBOT_PROFILE_PORTS:-Sapphire:8888,Ruby:8889,FR:8891}
  networks:
    fleet-private:
      aliases:
        - ${POKEBOT_PROFILE_SLUG:-pokebot}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8888/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # Default service. `docker compose up` starts only this container, preventing
  # concurrent access to the same profile/save by the optional GUI service.
  pokebot:
    <<: *pokebot-common
    ports:
      - "${POKEBOT_DASHBOARD_PORT:-8888}:8888"
    command:
      - python
      - pokebot.py
      - ${POKEBOT_PROFILE:-Sapphire}
      - --bot-mode
      - ${POKEBOT_MODE:-Living Dex Gen III}
      - --headless
      - --emulation-speed
      - ${POKEBOT_EMULATION_SPEED:-0}
      - --no-video
      - --no-audio

  pokebot-ruby:
    <<: *pokebot-common
    profiles: ["multi"]
    ports:
      - "8889:8888"
    networks:
      fleet-private:
        aliases: ["pokebot-ruby"]
    command: ["python", "pokebot.py", "Ruby", "--bot-mode", "Living Dex Gen III", "--headless", "--emulation-speed", "0", "--no-video", "--no-audio"]

  pokebot-firered:
    <<: *pokebot-common
    profiles: ["multi"]
    ports:
      - "8891:8888"
    networks:
      fleet-private:
        aliases: ["pokebot-firered"]
    command: ["python", "pokebot.py", "FR", "--bot-mode", "Living Dex Gen III", "--headless", "--emulation-speed", "0", "--no-video", "--no-audio"]

  # Opt-in because it shares writable profiles with the headless service.
  # Start with: docker compose --profile gui up pokebot-gui
  pokebot-gui:
    <<: *pokebot-common
    profiles: ["gui"]
    ports:
      - "${POKEBOT_DASHBOARD_PORT:-8888}:8888"
    environment:
      PYTHONUNBUFFERED: "1"
      # Script validates DISPLAY before starting GUI. Fallback keeps headless
      # Compose commands usable on hosts without an X11 session.
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./roms:/app/roms:ro
      - ./profiles:/app/profiles
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    command:
      - python
      - pokebot.py
      - ${POKEBOT_PROFILE:-Sapphire}
      - --bot-mode
      - ${POKEBOT_MODE:-Living Dex Gen III}
      - --emulation-speed
      - ${POKEBOT_EMULATION_SPEED:-1}
      - --no-audio

networks:
  fleet-private:
    name: pokebot-fleet
    external: true
