x-pokebot-common: &pokebot-common
  build:
    context: .
  init: true
  stdin_open: true
  tty: true
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    # All save states, screenshots, stats, RTC anchors, and configuration live
    # below the profile directory. Never mount those paths separately.
    - ./roms:/app/roms:ro
    - ./profiles:/app/profiles
  environment:
    PYTHONUNBUFFERED: "1"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8888/dashboard/state"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # Default service. `docker compose up` starts only this container, preventing
  # concurrent access to the same profile/save by the optional GUI service.
  pokebot:
    <<: *pokebot-common
    container_name: pokebot-gen3
    ports:
      - "${POKEBOT_DASHBOARD_PORT:-8888}:8888"
    command:
      - python
      - pokebot.py
      - ${POKEBOT_PROFILE:-Sapphire}
      - --bot-mode
      - ${POKEBOT_MODE:-Living Dex RSE}
      - --headless
      - --no-video
      - --no-audio

  # Opt-in because it shares writable profiles with the headless service.
  # Start with: docker compose --profile gui up pokebot-gui
  pokebot-gui:
    <<: *pokebot-common
    profiles: ["gui"]
    container_name: pokebot-gen3-gui
    ports:
      - "${POKEBOT_GUI_DASHBOARD_PORT:-8889}:8888"
    environment:
      PYTHONUNBUFFERED: "1"
      # Script validates DISPLAY before starting GUI. Fallback keeps headless
      # Compose commands usable on hosts without an X11 session.
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./roms:/app/roms:ro
      - ./profiles:/app/profiles
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    command:
      - python
      - pokebot.py
      - ${POKEBOT_PROFILE:-Sapphire}
      - --bot-mode
      - ${POKEBOT_MODE:-Living Dex RSE}
      - --no-audio
