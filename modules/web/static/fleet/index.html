<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>G3 Bot</title>
  <link rel="stylesheet" href="/fleet/assets/style.css">
</head>
<body>
  <header class="topbar">
    <strong><span>G3</span> BOT</strong>
    <label>Jogo
      <select id="game">
        <option>Emerald</option><option>Ruby</option><option>Sapphire</option>
        <option>FireRed</option><option>LeafGreen</option>
      </select>
    </label>
    <label>Profile
      <select id="profile"></select>
    </label>
    <i id="online">● offline</i>
  </header>

  <main>
    <aside class="profile-panel panel">
      <h2>Instância</h2>
      <dl><dt>Jogo</dt><dd id="instanceGame">—</dd><dt>Profile</dt><dd id="instanceProfile">—</dd><dt>Frame</dt><dd id="frame">—</dd><dt>FPS</dt><dd id="fps">—</dd></dl>
      <button id="startProfile" class="ok">▶ Iniciar profile</button>
      <button id="stopProfile">■ Parar profile</button>
      <button id="newProfile" class="ok">Novo profile</button>
      <button id="resetProfile" class="danger">Resetar profile</button>
      <button id="removeProfile" class="danger">Remover profile</button>
      <label>Save state
        <select id="saveStates"></select>
      </label>
      <button id="loadState">Carregar estado</button>
    </aside>

    <section class="operation">
      <div class="emulator panel">
        <div class="screen"><img id="screen" alt="Tela do Game Boy Advance"></div>
        <div class="toolbar">
          <button data-control="reset">↻ Resetar</button>
          <button data-control="toggle_video">▣ Tela</button>
          <button data-control="pause">Ⅱ Manual</button>
          <button data-control="save_state">◆ Salvar estado</button>
          <label>Velocidade
            <select id="speed">
              <option value="0">Máxima</option><option value="1">1×</option><option value="2">2×</option>
              <option value="3">3×</option><option value="4">4×</option><option value="8">8×</option>
              <option value="16">16×</option><option value="32">32×</option>
            </select>
          </label>
        </div>
      </div>
      <section class="activity panel">
        <h2>Atividade atual</h2>
        <strong id="mission">Sem atividade informada</strong>
        <p id="objective">Aguardando instância.</p>
      </section>
      <section class="log panel">
        <div class="panel-head"><h2>Log do bot</h2><select id="logFilter"><option value="all">Todos</option><option value="info">Info</option><option value="warning">Warning</option><option value="error">Error</option><option value="encounter">Encontros</option><option value="capture">Capturas</option></select></div>
        <pre id="botLog">Aguardando logs...</pre>
      </section>
    </section>

    <aside class="side">
      <section class="modes panel"><h2>Modo do bot</h2><select id="modes" aria-label="Modo do bot"></select></section>
      <section class="controls panel">
        <h2>Controles GBA</h2>
        <div class="dpad"><button data-button="Up">▲</button><button data-button="Left">◀</button><button data-button="Down">▼</button><button data-button="Right">▶</button></div>
        <div class="ab"><button data-button="B">B</button><button data-button="A">A</button></div>
        <div class="system"><button data-button="L">L</button><button data-button="Select">SELECT</button><button data-button="Start">START</button><button data-button="R">R</button></div>
      </section>
      <section class="recent panel"><h2>Últimos encontrados</h2><div id="encounters"></div></section>
    </aside>

    <section class="system-log panel">
      <h2>Log de sistema e erros</h2>
      <pre id="errorLog">Sem erros recentes.</pre>
    </section>
  </main>

  <dialog id="profileDialog">
    <form method="dialog">
      <h2>Novo profile</h2>
      <label>Nome do profile<input id="profileName" maxlength="80" required></label>
      <label>Nome no jogo<input id="trainerName" maxlength="7" required></label>
      <label>Gênero
        <select id="trainerGender"><option value="male">Masculino</option><option value="female">Feminino</option></select>
      </label>
      <label>Starter<select id="starter" required></select></label>
      <div><button value="cancel" formnovalidate>Cancelar</button><button id="createProfile" value="default" class="ok">Criar</button></div>
    </form>
  </dialog>
  <dialog id="alertDialog">
    <form method="dialog">
      <h2>Aviso</h2>
      <p id="alertMessage"></p>
      <div><button value="default" class="ok">OK</button></div>
    </form>
  </dialog>
  <script src="/fleet/assets/app.js"></script>
</body>
</html>
