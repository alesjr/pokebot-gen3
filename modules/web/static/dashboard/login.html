<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéBot · Login</title><link rel="stylesheet" href="/login.css"></head>
<body class="login-page"><main class="login-card"><div class="brand-mark">PB</div><small>ACESSO REMOTO</small><h1>PokéBot</h1><p>Entre para controlar sua caçada.</p>
<form method="post" action="/login"><label>Usuário<input name="username" autocomplete="username" maxlength="64" required autofocus></label><label>Senha<input type="password" name="password" autocomplete="current-password" maxlength="256" required></label><p class="error">{{ERROR}}</p><button type="submit">Entrar</button></form>
<footer>Protegido com Argon2id</footer></main></body></html>
