services:
  fleet-coordinator:
    image: pokebot-gen3:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${POKEBOT_FLEET_PORT:-8877}:8877"
    volumes:
      - ./fleet.yml:/app/fleet.yml:ro
      - ./stats:/app/stats
    environment:
      PYTHONUNBUFFERED: "1"
      POKEBOT_FLEET_TOKEN: ${POKEBOT_FLEET_TOKEN:?POKEBOT_FLEET_TOKEN required}
    command: ["python", "utility/fleet_coordinator.py"]
    networks: [fleet-private]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8877/fleet/state"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  fleet-private:
    name: pokebot-fleet
    external: true
